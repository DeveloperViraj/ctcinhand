<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .bg { fill: #12a06e; }
    .fg { fill: #ffffff; }
    .fg-line { fill: none; stroke: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #4fd6a0; }
      .fg { fill: #0d1714; }
      .fg-line { stroke: #0d1714; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="7"/>
  <!-- Outline bar = CTC, filled bar = what reaches your hand -->
  <rect class="fg-line" x="8.5" y="7.5" width="6" height="17" rx="1.5" stroke-width="1.8"/>
  <rect class="fg" x="17.5" y="12" width="6" height="12.5" rx="1.5"/>
</svg>
